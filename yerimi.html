<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Yer İmlerim</title>
    <style>
        /* CSS Değişkenleri ve Temel Ayarlar */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --accent: #4f46e5;
            --border: #e2e8f0;
        }

        /* Tarayıcı Koyu Tema Ayarı (Otomatik) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f1f5f9;
                --text-dim: #94a3b8;
                --accent: #818cf8;
                --border: #334155;
            }
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            transition: background 0.3s ease;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 2rem; }

        /* Arama ve Filtreleme Paneli */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input, select {
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            flex: 1;
            outline: none;
        }

        select { flex: 0 0 200px; cursor: pointer; }

        /* Kart Yapısı */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(79, 70, 229, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            align-self: flex-start;
        }

        .card h2 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
        .card a { color: var(--text-main); text-decoration: none; }
        .card a:hover { color: var(--accent); }

        .card p {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .url-text {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Yer İmlerim</h1>
    </header>

    <div class="controls">
        <input type="text" id="searchInp" placeholder="Site, adres veya açıklama ara..." oninput="render()">
        <select id="catFiltre" onchange="render()">
            <option value="">Tüm Kategoriler</option>
        </select>
    </div>

    <div id="grid" class="grid">
        <!-- Yer imleri buraya yüklenecek -->
    </div>
</div>

<script>
    let allData = [];

    // Veriyi Çek
    fetch('bookmarks.json')
        .then(res => res.json())
        .then(data => {
            allData = data;
            populateCategories();
            render();
        })
        .catch(err => {
            document.getElementById('grid').innerHTML = "<p>Veri yüklenemedi. 'bookmarks.json' dosyasının aynı klasörde olduğundan emin olun.</p>";
        });

    function populateCategories() {
        const cats = [...new Set(allData.map(item => item.kategori))].sort();
        const select = document.getElementById('catFiltre');
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
        });
    }

    function render() {
        const query = document.getElementById('searchInp').value.toLowerCase();
        const cat = document.getElementById('catFiltre').value;
        const grid = document.getElementById('grid');
        
        grid.innerHTML = '';

        const filtered = allData.filter(item => {
            const matchSearch = item.ad.toLowerCase().includes(query) || 
                               item.url.toLowerCase().includes(query) || 
                               item.aciklama.toLowerCase().includes(query);
            const matchCat = cat === '' || item.kategori === cat;
            return matchSearch && matchCat;
        });

        filtered.forEach(item => {
            const html = `
                <div class="card">
                    <span class="badge">${item.kategori}</span>
                    <h2><a href="${item.url}" target="_blank">${item.ad}</a></h2>
                    <p>${item.aciklama}</p>
                    <div class="url-text">${item.url}</div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', html);
        });
    }
</script>

</body>
</html>
